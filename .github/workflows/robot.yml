name: Robot Framework Tests

on:
  push:
    branches: [ cinema-challenge ]
  pull_request:
    branches: [ cinema-challenge ]

jobs:
  robot:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v3

      - name: Configurar Python 3.11
        uses: actions/setup-python@v4
        with:
          python-version: 3.11

      - name: Instalar dependências do projeto Robot Framework
        run: |
          pip install -r robotfrontend/requirements.txt

      - name: Inicializar RF Browser
        run: |
          rfbrowser init

      - name: Instalar dependências do frontend
        run: |
          cd robotfrontend
          npm install

      - name: Iniciar o frontend com npm start (em background)
        run: |
          cd robotfrontend
          npm start &
        env:
          CI: true

      - name: Aguardar frontend subir
        run: |
          echo "Esperando o frontend subir..."
          sleep 10

      - name: Executar testes Robot Framework
        run: |
          robot -d robotfrontend/logs --loglevel TRACE robotfrontend/resources/**/signup.robot

      - name: Upload de logs de execução
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: robot-logs
          path: |
            robotfrontend/logs/log.html
            robotfrontend/logs/report.html
            robotfrontend/logs/output.xml
