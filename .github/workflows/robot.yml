name: Robot Framework Tests

on:
  push:
    branches: [main, develop, cinema-challenge]
  pull_request:
    branches: [main, develop, cinema-challenge]

jobs:
  robot:
    runs-on: ubuntu-latest

    env:
      MONGO_URI: ${{ secrets.MONGO_URI }}
      DB_NAME: ${{ secrets.DB_NAME }}
      COLLECTION_NAME: ${{ secrets.COLLECTION_NAME }}

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v3

      - name: Configurar Python 3.11
        uses: actions/setup-python@v4
        with:
          python-version: 3.11

      - name: Instalar dependências do projeto
        run: |
          pip install -r robotfrontend/requirements.txt

      - name: Executar testes Robot Framework
        run: |
          robot -d robotfrontend/logs --loglevel TRACE robotfrontend/resources/tests/signup.robot

      - name: Upload de logs de execução
        uses: actions/upload-artifact@v4
        with:
          name: robot-logs
          path: robotfrontend/logs/
